[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "deterministic-media-enhancer"
version = "1.0.0rc5"
description = "Offline model-free image and video restoration skill"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
classifiers = ["Development Status :: 4 - Beta", "Environment :: Console", "Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3", "Topic :: Multimedia :: Graphics"]
[project.urls]
Repository = "https://github.com/Furox-Art/deterministic-media-enhancer"
[project.scripts]
dme = "dme_package.launcher:main"
[tool.setuptools]
packages = ["dme_package"]
include-package-data = true
[tool.setuptools.package-data]
dme_package = ["skill/*", "skill/src/*", "skill/scripts/*", "skill/tests/*", "skill/gpu/*", "skill/references/*"]
